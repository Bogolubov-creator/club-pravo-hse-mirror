name: Deploy Pages mirror

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Коммит, ветка или тег hse-law-alumni-club"
        required: true
        default: "main"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7.0.1
        with:
          repository: Bogolubov-creator/hse-law-alumni-club
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: src

      - name: Record source revision
        working-directory: src
        run: |
          git rev-parse HEAD > /tmp/mirror-source-revision
          printf 'Source commit: `%s`\n' "$(cat /tmp/mirror-source-revision)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install and build mirror
        working-directory: src
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @club/shared build
          pnpm --filter @club/web exec tsx scripts/sync-changes.ts --output public/data/changes.json --previous-published
          pnpm --filter @club/web build:mirror
          node -e 'const fs = require("node:fs"); fs.writeFileSync("frontend/dist/version.json", JSON.stringify({ source_commit: fs.readFileSync("/tmp/mirror-source-revision", "utf8").trim(), built_at: new Date().toISOString() }) + "\n")'

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: src/frontend/dist
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
