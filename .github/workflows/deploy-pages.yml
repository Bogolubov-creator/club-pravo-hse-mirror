name: Deploy Pages mirror

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Коммит, ветка или тег hse-law-alumni-club"
        required: true
        default: "main"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7.0.1
        with:
          repository: Bogolubov-creator/hse-law-alumni-club
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: src

      - name: Record source revision
        working-directory: src
        run: |
          git rev-parse HEAD > /tmp/mirror-source-revision
          printf 'Source commit: `%s`\n' "$(cat /tmp/mirror-source-revision)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"

      - name: Install and build mirror
        working-directory: src
        run: |
          uv sync --directory frontend --frozen
          uv run --directory frontend python -m club_web.sync_changes --output ../data/changes.json --previous-published
          uv run --directory frontend python -m club_web.mirror --output dist --base /club-pravo-hse-mirror/
          python3 - <<'PY'
          from datetime import UTC, datetime
          import json
          from pathlib import Path
          revision = Path('/tmp/mirror-source-revision').read_text().strip()
          data = {'source_commit': revision, 'built_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z')}
          Path('frontend/dist/version.json').write_text(json.dumps(data) + '\n')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: src/frontend/dist
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
